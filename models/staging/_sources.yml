version: 2

sources:
  - name: ga4_ecommerce
    description: >
      Public GA4 sample export of the Google Merchandise Store (obfuscated).
      Date-sharded tables events_YYYYMMDD, covering 2020-11-01 to 2021-01-31.
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: events_*
        description: >
          One row per event. Always filter on _TABLE_SUFFIX (see vars start_date / end_date)
          to control the bytes scanned.
